version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fruit_shop_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tuan2525
      POSTGRES_DB: fruit_shop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
